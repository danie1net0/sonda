name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        php: [ 8.4, 8.5 ]
        stability: [ prefer-lowest, prefer-stable ]
        phpunit: [ '^11.5', '^12.0' ]

    name: PHP ${{ matrix.php }} - PHPUnit ${{ matrix.phpunit }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, tokenizer, xml
          coverage: xdebug

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # PHPUnit 11 (Pest 3) and 12 (Pest 4), each at its lowest and its latest: the event facade
      # used by the collection window is internal to PHPUnit, and php-code-coverage 11 keeps its
      # data in arrays where 12 has objects, so every supported version runs the suite.
      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction "phpunit/phpunit:${{ matrix.phpunit }}"
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --with-all-dependencies

      # The compatibility classes of the php-code-coverage not installed cannot run here.
      - name: Measure the source this php-code-coverage runs
        run: php tools/phpunit-for-installed-coverage.php

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests with line and branch coverage
        run: vendor/bin/pest --ci --path-coverage --coverage-text --min=100
        env:
          XDEBUG_MODE: coverage
