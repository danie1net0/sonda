name: run-tests

on:
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
  push:
    branches: [master]
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        php: [ 8.4, 8.5 ]
        stability: [ prefer-lowest, prefer-stable ]
        phpunit: [ '^11.5', '^12.0', '^13.0' ]

    name: PHP ${{ matrix.php }} - PHPUnit ${{ matrix.phpunit }} - ${{ matrix.stability }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, tokenizer, xml
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      # PHPUnit 11 (Pest 3), 12 (Pest 4) and 13 (Pest 5), each at its lowest and its latest: the
      # event facade used by the collection window is internal to PHPUnit, php-code-coverage 11
      # keeps its data in arrays where 12 and 14 have objects, and 14 keeps the tests of a line as
      # indexes, so every supported version runs the suite.
      - name: Install dependencies
        run: |
          composer require --no-update --no-interaction "phpunit/phpunit:${{ matrix.phpunit }}"
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --with-all-dependencies

      # The compatibility classes of the php-code-coverage not installed cannot run here.
      - name: Measure the source this php-code-coverage runs
        run: php tools/phpunit-for-installed-coverage.php

      - name: List installed dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci --no-coverage

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Configure source for the installed coverage API
        run: php tools/phpunit-for-installed-coverage.php

      - name: Require full line and branch coverage of changed code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if ! git rev-parse --verify "$base^{commit}" >/dev/null 2>&1; then
            base=HEAD^
          fi
          php tools/self-coverage.php --changed="$base" --affected -- --ci
